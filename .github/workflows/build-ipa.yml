name: Build BookQ IPA + APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project QuizApp.xcodeproj \
            -scheme QuizApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/QuizApp.app"
          test -d "$APP_PATH"
          rm -rf Payload BookQ-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr BookQ-unsigned.ipa Payload
          ls -lh BookQ-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookQ-unsigned-ipa
          path: BookQ-unsigned.ipa
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi
          ls "$ANDROID_HOME/platforms" | tail -5

      - name: Build signed Android APK
        working-directory: BookQAndroid
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp BookQAndroid/app/build/outputs/apk/release/app-release.apk BookQ-Android-0.1.4.apk
          ls -lh BookQ-Android-0.1.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookQ-android-apk
          path: BookQ-Android-0.1.4.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ios, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: BookQ-unsigned-ipa
          path: release-assets

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: BookQ-android-apk
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
          files: |
            release-assets/BookQ-unsigned.ipa
            release-assets/BookQ-Android-0.1.4.apk
